services:
    backend:
        build:
            context: ./core
        container_name: ListExpress-core
        restart: unless-stopped
        ports:
            - '3010:3000'
        working_dir: /app
        volumes:
            - ./core:/app
            - /app/node_modules
        command: sh -c "npm install && npm run dev"

    frontend:
        build:
            context: ./gui
        container_name: ListExpress-gui
        restart: unless-stopped
        ports:
            - '5173:5173'
        working_dir: /app
        volumes:
            - ./gui:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
        depends_on:
            - backend
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
